<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Project</title>
</head>
<body>
<div align="center">
    <div th:replace="~{header :: header}"></div>
    <p th:if="${success}" th:text="${success}" style="color : green"></p>
    <p th:if="${fail}" th:text="${fail}" style="color : red"></p>
    <h2>Project Form</h2>
    <form method="post" th:object="${project}" th:action="@{/api/v1/projects}">
        <input type="hidden" th:field="*{id}">
        <input
        type="text"
        placeholder="Enter Project Name"
        th:field="*{name}"
        required
        ><br/><br/>
        <input
        type="text"
        th:field="*{description}"
        placeholder="Enter Project Description"
        required
        ><br/><br/>
        <input
        type="datetime-local"
        placeholder="Enter Start Date"
        th:field="*{startDate}"
        required
        ><br/><br/>
        <input
        type="datetime-local"
        placeholder="Enter End Date"
        th:field="*{endDate}"
        required
        ><br/><br/>
        <button th:text="${project.id==null ? 'SAVE' : 'UPDATE' }"></button>
    </form>
    <table border="1" sec:authorize="hasRole('USER')">
        <h2>My Own Projects</h2>
        <thead>
        <th>#</th>
        <th>Name</th>
        <th>Description</th>
        <th>StartDate</th>
        <th>EndDate</th>
        <th>Actions</th>
        </thead>
        <tbody>
        <tr th:each="p,stat : ${myProjects}">
            <td th:text="${stat.count}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.description}"></td>
            <td th:text="${p.startDate}"></td>
            <td th:text="${p.endDate}"></td>
            <td>
                <a th:href="@{/api/v1/projects/{projectId}/edit(projectId=${p.id})}"><button>Edit</button></a>
                <a th:href="@{/api/v1/projects/{projectId}/delete(projectId=${p.id})}"><button>Delete</button></a>
                <a th:href="@{/api/v1/projects/{projectId}/members(projectId=${p.id})}"><button>Add/Remove Members</button></a>
            </td>
        </tr>
        </tbody>
    </table>
    <h3>Enrolled Project As a Member</h3>
    <table border="1">
        <thead>
        <th>#</th>
        <th>Project</th>
        <th>Join Date</th>
        <th>Actions</th>
        </thead>
        <tbody>
        <tr th:each="project,stat : ${projectsByMember}">
            <td th:text="${stat.count}"></td>
            <td th:text="${project.projectName}"></td>
            <td th:text="${project.joinedAt}"></td>
            <td>
                <a th:href="@{/api/v1/projects/{projectId}(projectId=${project.projectId})}">
                    <button>Show Project Members</button></a>
            </td>
        </tr>
        </tbody>
    </table>
    <table border="1">
        <thead>
        <th>#</th>
        <th>Member Name</th>
        </thead>
        <tbody>
        <tr th:each="member,stat : ${addedMembers}">
            <td th:text="${stat.count}">
            <td th:text="${member.memberName}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
