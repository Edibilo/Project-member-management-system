<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>User</title>
</head>
<body>
<div align="center">
    <div th:replace="~{header :: header}"></div>
    <h2>User Form</h2>
   <form method="post" th:action="@{/api/v1/auth/register}" th:object="${user}">
       <input
       type="hidden"
       th:field="*{id}"
       >
       <input
               type="text"
               placeholder="Enter Username"
               th:field="*{username}"
               required
       ><br/><br/>
       <input
               type="email"
               placeholder="Enter Email"
               th:field="*{email}"
               required
       ><br/><br/>
       <input
               type="password"
               placeholder="Enter Password"
               th:field="*{password}"
               required
       ><br/><br>
       <select th:field="*{status}" required>
           <option value="">Select Gender</option>
           <option th:each="stat : ${status}" th:text="${stat}" th:value="${stat}"></option>
       </select><br/><br/>
       <select th:field="*{roleId}" required sec:authorize="hasRole('ADMIN')">
           <option value="">Select Role</option>
           <option th:each="role : ${roles}" th:text="${role.name}" th:value="${role.id}"></option>
       </select><br/><br/>
       <input sec:authorize="!hasRole('ADMIN')"
       type="hidden"
       th:field="*{roleId}"
       >
       <button th:text="${user.id==null ? 'REGISTER' : 'UPDATE' }"></button>
   </form>

</div>
</body>
</html>
