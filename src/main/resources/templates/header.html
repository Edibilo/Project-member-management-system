<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Header</title>
</head>
<body>
<div align="center">
    <div th:fragment="header">
        <nav>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/api/v1/roles}" >Role</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/api/v1/users/profile}">Profile</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/api/v1/users}" >User</a>
            <a sec:authorize="hasAnyRole('USER')" th:href="@{/api/v1/projects}" >Project</a>
            <a sec:authorize="isAnonymous()" th:href="@{/api/v1/auth/register}">Register</a>
            <a sec:authorize="isAnonymous()" th:href="@{/api/v1/auth/login}">Login</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/api/v1/auth/logout}">Logout</a>
        </nav>
    </div>
</div>
</body>
</html>
