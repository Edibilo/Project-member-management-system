<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<div align="center">
    <div th:replace="~{header :: header}"></div>
    <h2>Login Form</h2>
    <form method="post">
        <input
        type="text"
        placeholder="Enter Email"
        name="username"
        required
        ><br/><br/>
        <input
        type="password"
        placeholder="Enter Password"
        name="password"
        required
        ><br/><br/>
        <button>Login</button>
    </form>
</div>
</body>
</html>
